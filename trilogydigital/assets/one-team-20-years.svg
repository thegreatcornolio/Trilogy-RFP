  <text transform="translate(46 250) rotate(-90)" class="axis green">COMPANIES</text>
  <text transform="translate(46 560) rotate(-90)" class="axis green">UK CLIENTS</text>

  <!-- Timeline rail -->
  <line x1="90" y1="390" x2="1350" y2="390" stroke="#61d779" stroke-width="4" stroke-linecap="round"/>

