<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="One Team, 20 Years — Management Journey and UK Client Experience">
  <defs>
    <style>
      .bg { fill: #13202e; }
      .panel { fill: #1a2838; }
      .green { fill: #61d779; }
      .lime { fill: #d5ec67; }
      .white { fill: #ffffff; }
      .muted { fill: rgba(255,255,255,0.72); }
      .faint { fill: rgba(255,255,255,0.45); }
      .title { font-family: Poppins, Inter, Arial, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1.5px; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 13px; }
      .role { font-family: Inter, Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.8px; }
      .name { font-family: Inter, Arial, sans-serif; font-size: 13px; }
      .axis { font-family: Inter, Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; }
      .co { font-family: Poppins, Inter, Arial, sans-serif; font-weight: 700; font-size: 15px; }
      .dates { font-family: Inter, Arial, sans-serif; font-size: 11px; }
      .clients { font-family: Inter, Arial, sans-serif; font-size: 11px; }
      .note { font-family: Inter, Arial, sans-serif; font-size: 10px; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="720" rx="18"/>

  <!-- Header panel -->
  <rect class="panel" x="28" y="24" width="1344" height="118" rx="14"/>
  <text x="52" y="62" class="title green">ONE TEAM, 20 YEARS</text>
  <text x="52" y="88" class="sub white">Same founders / EXCO team have worked together across all these companies.</text>

  <!-- EXCO right -->
  <text x="780" y="58" class="role green">CEO</text>
  <text x="780" y="76" class="name white">Kobus van der Westhuizen</text>
  <text x="780" y="104" class="role green">CTO</text>
  <text x="780" y="122" class="name white">Craig Shalekoff</text>

  <text x="1080" y="58" class="role green">COO</text>
  <text x="1080" y="76" class="name white">Tanya Phillips</text>
  <text x="1080" y="104" class="role green">HEAD OF TRANSITIONS</text>
  <text x="1080" y="122" class="name white">Vancyon Van Zyl</text>

