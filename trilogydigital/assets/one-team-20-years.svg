pe), Lexis Nexis</text><text x="520" y="260" text-anchor="middle" class="co" fill="#ffffff">Genii Ai</text><text x="520" y="280" text-anchor="middle" class="dates faint">2013 – 2021</text><line x1="520" y1="295" x2="520" y2="378" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><circle cx="520" cy="390" r="10" fill="#61d779"/><circle cx="520" cy="390" r="4.5" fill="#13202e"/><text x="520" y="430" text-anchor="middle" class="clients faint">—</text><rect x="644.0" y="188" width="132" height="46" rx="6" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><text x="710" y="204" text-anchor="middle" class="note faint">Ascensos acquires</text><text x="710" y="218" text-anchor="middle" class="note faint">Digital Tribe</text><text x="710" y="260" text-anchor="middle" class="co" fill="#ffffff">Digital Tribe</text><text x="710" y="280" text-anchor="middle" class="dates faint">2021 – 2023</text><line x1="710" y1="295" x2="710" y2="378" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><circle cx="710" cy="390" r="10" fill="#61d779"/><circle cx="710" cy="390" r="4.5" fill="#13202e"/><text x="710" y="430" text-anchor="middle" class="clients muted">Ascensos (GCC)</text><text x="900" y="260" text-anchor="middle" class="co" fill="#ffffff">Ascensos</text><text x="900" y="280" text-anchor="middle" class="dates faint">2023 – 2025</text><line x1="900" y1="295" x2="900" y2="378" stroke="rgba(255,255,255,0.18)" stroke-width="1"/><circle cx="900" cy="390" r="10" fill="#61d779"/><circle cx="900" cy="390" r="4.5" fill="#13202e"/><text x="900" y="430" text-anchor="middle" class="clients muted">John Lewis, WeWork, Iceland,</text><text x="900" y="446" text-anchor="middle" class="clients muted">JD Sports, Aldi, Virgin ED</text><text x="1090" y="260" text-anchor="middle" class="co" fill="#ffffff">Trilogy BPO</text><text x="1090" y="280" text-anchor="middle" class="dates faint">2025 – Now</text><line x1="1090" y1="295" x2="1090" y2="378" stroke="rgba(255,255,255,0.18)" stroke-width="1"/