<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- TITLE --> — Trilogy</title>
  <meta name="description" content="<!-- DESCRIPTION -->">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_shared/deck.css">
  <style id="deck-theme">
    :root {
      --blend-navy: #13202e;
      --blend-navy-2: #1a2b3d;
      --blend-primary: #61d779;
      --blend-accent: #d5ec67;
      --blend-secondary: #2f9e4a;
      --source-brand: #61d779;
    }
  </style>
</head>
<body class="deck">
  <div class="deck-bars" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="deck-chrome">
    <img class="deck-chrome__logo" src="../_shared/trilogy-logo.svg" alt="Trilogy">
    <p class="deck-chrome__title"><!-- TITLE --></p>
    <span class="deck-chrome__progress" data-progress-label>1 / 1</span>
  </header>
  <div class="deck-progressbar" aria-hidden="true"><span data-progress-bar></span></div>

  <main class="slides">
    <section class="slide slide--cover is-active" data-slide="1">
      <p class="eyebrow">Trilogy presentation</p>
      <h1><!-- TITLE --></h1>
      <p class="lede">Replace this template with extracted source slides. Keep section order; apply the blended theme tokens above.</p>
    </section>
  </main>

  <p class="deck-hint">Arrow keys or Space to advance</p>
  <nav class="deck-nav" aria-label="Slide navigation">
    <button type="button" data-prev aria-label="Previous slide">‹</button>
    <button type="button" data-next aria-label="Next slide">›</button>
  </nav>
  <script src="../_shared/deck.js"></script>
</body>
</html>
